<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a192f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#112240;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#64ffda;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1de9b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-gradient)"/>
  <g fill="none" stroke="url(#accent-gradient)" stroke-width="2" opacity="0.6">
    <rect x="200" y="250" width="120" height="80" rx="8"/>
    <rect x="340" y="250" width="120" height="80" rx="8"/>
    <rect x="480" y="250" width="120" height="80" rx="8"/>
    <line x1="260" y1="330" x2="340" y2="330" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="400" y1="330" x2="480" y2="330" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="340" y="130" width="120" height="80" rx="8" opacity="0.5"/>
    <line x1="400" y1="210" x2="400" y2="250" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="url(#accent-gradient)"/>
    </marker>
  </defs>
  <text x="400" y="480" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#ccd6f6" text-anchor="middle">RAG Pipeline</text>
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="16" fill="#8892b0" text-anchor="middle">Hybrid Search with Reranking</text>
</svg>