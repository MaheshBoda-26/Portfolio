    <polygon points="395,395 405,395 400,385" fill="url(#accent-gradient)" opacity="0.7"/>
  </g>
  <text x="400" y="480" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#ccd6f6" text-anchor="middle">AI Support Agent</text>
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="16" fill="#8892b0" text-anchor="middle">Full-Stack Customer Support AI</text>
