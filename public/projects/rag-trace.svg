<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a192f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#112240;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#64ffda;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1de9b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-gradient)"/>
  <g stroke="url(#accent-gradient)" stroke-width="2" fill="none" opacity="0.6">
    <polyline points="150,350 250,300 350,380 450,280 550,360 650,290"/>
    <line x1="150" y1="350" x2="150" y2="450" stroke-width="1" opacity="0.3"/>
    <line x1="250" y1="300" x2="250" y2="450" stroke-width="1" opacity="0.3"/>
    <line x1="350" y1="380" x2="350" y2="450" stroke-width="1" opacity="0.3"/>
    <line x1="450" y1="280" x2="450" y2="450" stroke-width="1" opacity="0.3"/>
    <line x1="550" y1="360" x2="550" y2="450" stroke-width="1" opacity="0.3"/>
    <line x1="650" y1="290" x2="650" y2="450" stroke-width="1" opacity="0.3"/>
  </g>
  <circle cx="400" cy="220" r="50" fill="none" stroke="url(#accent-gradient)" stroke-width="3" opacity="0.4"/>
  <text x="400" y="480" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#ccd6f6" text-anchor="middle">RAG Trace Debugger</text>
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="16" fill="#8892b0" text-anchor="middle">Observability for RAG Pipelines</text>
</svg>